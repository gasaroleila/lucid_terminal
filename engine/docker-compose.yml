# docker-compose.yml — Full trading system stack
# Use this starting Weekend 3 when you add Kafka and the sentiment service.
#
# Run: docker-compose up -d
# Kafka UI: http://localhost:8080

services:
  # ── Kafka (message streaming) ──────────────────────────────
  # Using KRaft mode (no Zookeeper needed, simpler setup)
  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "9092:9092"      # External client connections
    environment:
      - KAFKA_NODE_ID=0
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - CLUSTER_ID=lucid-terminal-kafka-001
    volumes:
      - kafka_data:/tmp/kraft-combined-logs

  # ── Kafka UI (optional, for debugging) ─────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    depends_on:
      - kafka

  # ── Ingest Sidecar (Finnhub WebSocket → Kafka) ─────────────
  # Set INGEST_MODE=simulate in .env to use fake data outside market hours
  ingest:
    build:
      context: ./services/ingest
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - FINNHUB_API_KEY=${FINNHUB_API_KEY}
      - KAFKA_BOOTSTRAP=kafka:9092
      - SYMBOLS=AAPL,MSFT,GOOGL,AMZN,TSLA
      - INGEST_MODE=${INGEST_MODE:-simulate}
    depends_on:
      - kafka

  # ── Sentiment Service (Python + LangGraph + Groq) ───────────
  sentiment-service:
    build:
      context: ./services/sentiment
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - KAFKA_BOOTSTRAP=kafka:9092
      - SYMBOLS=AAPL,MSFT,GOOGL,AMZN,TSLA
      - POLL_INTERVAL=900
    depends_on:
      - kafka

  # ── OCaml Trading Engine ───────────────────────────────────
  trading-engine:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - KAFKA_BOOTSTRAP=kafka:9092
      - SENTIMENT_HOST=sentiment-service:50051
    depends_on:
      - kafka
      - sentiment-service

volumes:
  kafka_data:
